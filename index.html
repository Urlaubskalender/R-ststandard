<html lang="de">

<title>RüstStandard – Final</title>
<style>
:root{--bg:#f3f6fa;--panel:#fff;--ink:#142033;--muted:#718096;--line:#e1e8f0;--nav:#08111f;--nav2:#101c2d;--blue:#12a5e5;--blue2:#0781b8;--green:#16a34a;--red:#dc2626;--orange:#d97706}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}
header{height:70px;background:var(--nav);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:20}.logo{font-size:22px;font-weight:850}.logo span{color:#58d8ff}.headRight{display:flex;gap:9px;align-items:center}.status{font-size:12px;padding:7px 10px;background:#18263b;border-radius:999px;font-weight:700}
.layout{display:flex;min-height:calc(100vh - 70px)}aside{width:240px;background:var(--nav2);padding:14px 10px;color:#cbd5e1;flex:none}.nav{width:100%;display:block;border:0;background:none;color:#cbd5e1;padding:13px;border-radius:11px;text-align:left;font-weight:750;margin:3px 0}.nav:hover,.nav.active{background:#1d2c43;color:#fff}.navIcon{font-size:21px;display:inline-block;line-height:1}.adminTop{background:#12a5e5;color:#fff!important;min-width:116px}
main{width:100%;max-width:1500px;margin:auto;padding:25px}.hero{border-radius:24px;padding:31px;background:linear-gradient(135deg,#08111f,#174c6c);color:#fff;margin-bottom:18px}.eyebrow{font-size:12px;letter-spacing:.13em;font-weight:850;color:#a6e7ff}.hero h1{font-size:36px;margin:8px 0}.hero p{color:#d7e3ed;max-width:850px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:19px;box-shadow:0 7px 25px #14203309}.bigChoice{padding:28px;text-align:left;min-height:150px;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:0 7px 25px #1420330b}.bigChoice:hover{border-color:var(--blue);transform:translateY(-1px)}.bigChoice h2{margin:8px 0}.green{border-left:6px solid var(--green)}.red{border-left:6px solid var(--red)}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800}.primary{background:var(--blue);color:#fff}.primary:hover{background:var(--blue2)}.secondary{background:#eaf0f6;color:#172033}.danger{background:#fee2e2;color:#b91c1c}.warning{background:#fff2d8;color:#955a00}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}.muted{color:var(--muted)}.small{font-size:12px}
.search{width:100%;border:1px solid #d5dfe9;border-radius:12px;padding:14px;background:#fff;outline:0;margin-bottom:14px}.list{display:grid;gap:11px}.item{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:15px}.itemTitle{font-weight:850}.tag{display:inline-block;border-radius:999px;background:#e4f5fd;color:#056995;padding:4px 8px;font-size:11px;font-weight:750;margin:3px 3px 0 0}
.modal{position:fixed;inset:0;background:#030914bd;display:flex;align-items:center;justify-content:center;padding:14px;z-index:100}.box{width:min(1000px,100%);max-height:94vh;overflow:auto;background:#fff;border-radius:20px;padding:21px}.modalHead{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.close{border:0;background:#edf2f6;border-radius:9px;padding:8px 11px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:800}.field input,.field textarea,.field select{border:1px solid #d4dee8;border-radius:10px;padding:10px 11px;background:#fff;outline:none}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #12a5e51a}.field textarea{min-height:110px;resize:vertical}
.step{border:1px solid var(--line);background:#f8fafc;border-radius:15px;padding:15px;margin:12px 0}.stepHead{display:flex;justify-content:space-between;align-items:center;gap:10px}.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:9px;margin-top:10px}.thumb{position:relative}.thumb img{width:100%;height:100px;object-fit:cover;border-radius:10px;background:#edf2f6}.thumb button{position:absolute;right:4px;top:4px;border:0;border-radius:6px;background:#fff;padding:2px 7px}.drop{border:2px dashed #c9d5e1;border-radius:11px;padding:12px}
.wizard{max-width:900px}.progress{height:7px;background:#e3e9ef;border-radius:8px;overflow:hidden}.progress i{display:block;height:100%;background:var(--blue)}.wimg{width:100%;max-height:440px;object-fit:contain;background:#edf2f6;border-radius:12px;margin-top:10px}.stepRoleBadge{display:inline-block;margin-bottom:10px;padding:8px 12px;border-radius:999px;background:#eef6fb;font-size:14px;font-weight:800;color:var(--ink)}.stepRoleBadge.role-einrichter{background:#fee2e2;color:#b91c1c}.stepRoleBadge.role-bediener{background:#dbeafe;color:#1d4ed8}.stepRoleBadge.role-beide{background:#eef2f7;color:#334155}.check{display:flex;align-items:center;gap:9px;background:#edf8fe;border-radius:10px;padding:12px;margin-top:15px;font-weight:750}.check input{width:20px;height:20px}.special{background:#fff7e6;border:1px solid #f0d092;border-radius:12px;padding:13px;margin-top:12px}.special b{color:#8a5700}.error{background:#fff0f0;border:1px solid #efc8c8;border-radius:12px;padding:13px}.notice{background:#fff7e6;border:1px solid #f0d092;border-radius:12px;padding:13px;margin:12px 0}.notice b{color:#8a5700}.star{border:0;background:#eef3f8;border-radius:10px;padding:8px 10px;font-size:20px;line-height:1}.star.on{background:#fff4c7}.mini{padding:7px 10px;font-size:13px}.stepOrder{display:flex;gap:6px;flex-wrap:wrap}.stepOrder button{padding:6px 9px}
.empty{text-align:center;padding:42px;color:var(--muted);background:#fff;border:1px dashed #ccd7e2;border-radius:15px}
@media(max-width:820px){aside{width:67px}.nav{font-size:0;text-align:center}.navIcon{font-size:22px}.main{padding:14px}.form{grid-template-columns:1fr}.field.full{grid-column:auto}.hero{padding:23px}.hero h1{font-size:29px}.item{align-items:flex-start;flex-direction:column}.headRight .status{display:none}}
</style>

function readDefaultTemplate(){
 const bytes=Uint8Array.from(atob(DEFAULT_TEMPLATE_B64),c=>c.charCodeAt(0));
 return JSON.parse(new TextDecoder("utf-8").decode(bytes));
}
async function installDefaultTemplate(force=false){
 const template=readDefaultTemplate();
 const templateIds=new Set(template.standards.map(s=>s.id));
 const existingById=new Map(state.standards.map(s=>[s.id,s]));
 if(force && !confirm("Die 18 integrierten SMED-Standardvorlagen werden auf den Stand dieser HTML-Datei zurückgesetzt. Favoriten bleiben erhalten. Eigene zusätzliche Standards bleiben bestehen. Fortfahren?")) return;
 const builtIns=template.standards.map(s=>{
  const old=existingById.get(s.id);
  return {...clone(s),favorite:old?!!old.favorite:!!s.favorite};
 });
 const custom=state.standards.filter(s=>!templateIds.has(s.id));
 state.standards=[...builtIns,...custom];
 state.recent=(state.recent||[]).filter(id=>state.standards.some(s=>s.id===id));
 await save();
 alert(force?"Die integrierte Standardvorlage wurde aktualisiert.":"Die integrierte Standardvorlage wurde geladen.");
 admin();
}

function esc(v=""){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function uid(){return"i_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2)}
function clone(v){return JSON.parse(JSON.stringify(v))}
function tags(a=[]){return a.filter(Boolean).map(x=>`<span class="tag">${esc(x)}</span>`).join("")}
function db(){return new Promise((ok,no)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function get(k){try{let d=await db();return await new Promise((ok,no)=>{let q=d.transaction("kv","readonly").objectStore("kv").get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})}catch{return null}}
async function set(k,v){let d=await db();return new Promise((ok,no)=>{let t=d.transaction("kv","readwrite");t.objectStore("kv").put(v,k);t.oncomplete=ok;t.onerror=()=>no(t.error)})}
async function save(){await set("state",state)}
function shell(active,body){document.getElementById("app").innerHTML=`
<header><div class="logo">⚙️ Rüst<span>Standard</span></div><div class="headRight"><span class="status">● Offline gespeichert</span><button class="btn adminTop" onclick="openAdmin()">⚙️ ADMIN</button></div></header>
<div class="layout"><aside>
<button class="nav ${active=="home"?"active":""}" onclick="home()"><span class="navIcon">🏠</span> <span>Start</span></button>
<button class="nav ${active=="search"?"active":""}" onclick="search()"><span class="navIcon">🔎</span> <span>Suche</span></button>
</aside><main>${body}</main></div>`}

function home(){
 const fav=state.standards.filter(s=>s.favorite);
 const recent=(state.recent||[]).map(id=>state.standards.find(s=>s.id===id)).filter(Boolean);
 shell("home",`
<section class="hero"><div class="eyebrow">PRESSWERK • RÜSTSTANDARD</div><h1>Wie wird umgebaut?</h1><p>Wähle zuerst den Umbautyp. Danach beginnt die hinterlegte Anleitung direkt mit dem ersten Arbeitsschritt.</p></section>
<div class="grid">
<button class="bigChoice green" onclick="chooseType('plan')"><div class="eyebrow" style="color:#16803b">PLANMÄSSIG</div><h2>🟢 Planmäßiger Umbau</h2><div class="muted">Geplanter, vorbereiteter Umbau.</div></button>
<button class="bigChoice red" onclick="chooseType('unplan')"><div class="eyebrow" style="color:#c32626">UNPLANMÄSSIG</div><h2>🔴 Unplanmäßiger Umbau</h2><div class="muted">Umbau aufgrund einer ungeplanten Situation.</div></button>
</div>
${fav.length?`<div class="card" style="margin-top:16px"><h3>⭐ Meine häufigen Rüststandards</h3><div class="list">${fav.map(s=>standardHomeItem(s)).join("")}</div></div>`:""}
${recent.length?`<div class="card" style="margin-top:16px"><h3>🕘 Zuletzt verwendet</h3><div class="list">${recent.map(s=>standardHomeItem(s,true)).join("")}</div></div>`:""}
`)}
function standardHomeItem(s,recent=false){return `<div class="item"><div><div class="itemTitle">${recent?"🕘":"⭐"} ${esc(s.name)}</div><div class="muted">${s.type==="plan"?"Planmäßiger":"Unplanmäßiger"} Umbau • ${s.steps.length} Schritte • Version ${Number(s.version)||1}</div></div><button class="btn primary" onclick="startGuide('${s.id}')">Starten →</button></div>`}
function chooseType(type){
 currentType=type;
 const arr=state.standards.filter(s=>s.type===type);
 shell("home",`<section class="hero"><div class="eyebrow">${type==="plan"?"PLANMÄSSIGER":"UNPLANMÄSSIGER"} UMBAU</div><h1>Anleitung auswählen</h1><p>Wähle den passenden Rüststandard.</p></section>
 <div class="list">${arr.map(s=>`<div class="item"><div style="flex:1"><div class="itemTitle">${esc(s.name)}</div><div class="muted">${esc(s.intro)}</div><div>${tags(s.tags)}</div></div><div class="actions" style="margin:0"><button class="star ${s.favorite?"on":""}" title="${s.favorite?"Favorit entfernen":"Als Favorit markieren"}" onclick="toggleFavorite('${s.id}')">${s.favorite?"★":"☆"}</button><button class="btn primary" onclick="startGuide('${s.id}')">Starten →</button></div></div>`).join("")||'<div class="empty">Noch keine Anleitung vorhanden. Im Admin-Menü kannst du eine erstellen.</div>'}</div>
 <div class="actions"><button class="btn secondary" onclick="home()">← Zurück</button></div>`);
} 
async function toggleFavorite(id){const s=state.standards.find(x=>x.id===id);if(!s)return;s.favorite=!s.favorite;await save();if(currentType)chooseType(currentType);else home()}

function openAdmin(){
 document.getElementById("adminLogin")?.remove();
 document.body.insertAdjacentHTML("beforeend",`<div class="modal" id="adminLogin">
  <div class="box" style="max-width:430px">
   <div class="modalHead"><h2 style="margin:0">🔐 Admin-Bereich</h2><button class="close" onclick="document.getElementById('adminLogin').remove()">✕</button></div>
   <p class="muted">Bitte Admin-Passwort eingeben.</p>
   <div class="field"><label>Passwort</label><input id="adminPassword" type="password" inputmode="numeric" autocomplete="off" placeholder="Passwort" onkeydown="if(event.key==='Enter')checkAdminPassword()"></div>
   <div class="actions"><button class="btn secondary" onclick="document.getElementById('adminLogin').remove()">Abbrechen</button><button class="btn primary" onclick="checkAdminPassword()">🔓 Anmelden</button></div>
   <div id="adminError" class="small" style="color:#dc2626;margin-top:10px"></div>
  </div>
 </div>`);
 setTimeout(()=>document.getElementById("adminPassword")?.focus(),50);
}
function checkAdminPassword(){
 const input=document.getElementById("adminPassword");
 const error=document.getElementById("adminError");
 if(!input)return;
 if(input.value==="1234"){
  document.getElementById("adminLogin")?.remove();
  admin();
 }else{
  error.textContent="Falsches Passwort.";
  input.value="";
  input.focus();
 }
}
function leaveAdmin(){
  document.querySelectorAll(".modal").forEach(x=>x.remove());
  editing=null;
  currentType=null;
  home();
}

<div class="card" style="margin-top:16px"><h3>📚 Integrierte Standardvorlage</h3><p class="muted">Die 18 kompakten SMED-Rüststandards für 9 Maschinengruppen sind fest in dieser HTML-Datei hinterlegt. Beim ersten Start werden fehlende Vorlagen automatisch ergänzt. Eigene zusätzliche Standards bleiben erhalten.</p><div class="actions"><button class="btn secondary" onclick="installDefaultTemplate(true)">↻ Integrierte Vorlage aktualisieren</button></div></div>
<div class="card" style="margin-top:16px"><h3>💾 Datensicherung</h3><p class="muted"><b>Vollbackup:</b> Texte, Schritte, Favoriten, zuletzt verwendete Standards und die tatsächlichen Bilddaten werden gemeinsam gesichert.</p><div class="notice"><b>Backup-Status</b><br>${state.lastBackup?"Letztes Backup: "+new Date(state.lastBackup).toLocaleString("de-DE"):"Noch kein Backup erstellt."}<br>${state.standards.length} Standards • ${countBackupImages(state)} Bilder</div><div class="actions"><button class="btn primary" onclick="backup()">⬇ Vollständiges Backup erstellen</button><button class="btn secondary" onclick="restore()">⬆ Vollständiges Backup wiederherstellen</button><button class="btn secondary" onclick="backupCheck()">✓ Backup prüfen</button></div></div><div class="actions" style="justify-content:flex-end;margin-top:18px"><button class="btn secondary" onclick="leaveAdmin()">🔒 Admin-Modus verlassen</button></div>`)}
function standardList(type){const title=type==="plan"?"Planmäßige Umbauten":"Unplanmäßige Umbauten";const list=state.standards.filter(s=>s.type===type);modal(title,`<button class="btn primary" onclick="standardForm('', '${type}')">＋ Anleitung erstellen</button><p class="muted small" style="margin:10px 0 0">Mit ↑ und ↓ kannst du die Reihenfolge der Anleitungen festlegen.</p><div class="list" style="margin-top:12px">${list.map((s,n)=>`<div class="item"><div><div class="itemTitle">${esc(s.name)}</div><div class="muted">${s.steps.length} Schritte • Version ${Number(s.version)||1}</div></div><div class="actions" style="margin:0;gap:6px;flex-wrap:wrap"><button class="btn secondary" onclick="moveStandard('${s.id}',-1)" ${n===0?'disabled':''}>↑</button><button class="btn secondary" onclick="moveStandard('${s.id}',1)" ${n===list.length-1?'disabled':''}>↓</button><button class="btn secondary" onclick="standardForm('${s.id}')">Bearbeiten</button><button class="btn secondary" onclick="copyStandard('${s.id}')">Kopieren</button><button class="btn danger" onclick="deleteStandard('${s.id}')">Löschen</button></div></div>`).join("")||'<div class="empty">Noch keine Anleitung vorhanden.</div>'}</div>`)}
async function moveStandard(id,dir){const idx=state.standards.findIndex(s=>s.id===id);if(idx<0)return;const type=state.standards[idx].type;const same=state.standards.map((s,i)=>s.type===type?i:-1).filter(i=>i>=0);const pos=same.indexOf(idx);const newPos=pos+dir;if(newPos<0||newPos>=same.length)return;const target=same[newPos];[state.standards[idx],state.standards[target]]=[state.standards[target],state.standards[idx]];await save();closeModal();standardList(type)}
async function copyStandard(id){const src=state.standards.find(s=>s.id===id);if(!src)return;const c=clone(src);c.id=uid();c.name=(src.name||"Anleitung")+" (Kopie)";c.favorite=false;c.version=1;c.createdAt=new Date().toISOString();c.updatedAt=new Date().toISOString();state.standards.push(c);await save();closeModal();standardList(c.type)}
function standardForm(id,type){
 const source=(id&&editing&&editing.id===id)?editing:(id?state.standards.find(x=>x.id===id):null);
 const s=source?clone(source):{id:uid(),type:type||"plan",name:"",intro:"",tags:[],steps:[],version:1,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};
 editing=clone(s);
 modal(id?"Anleitung bearbeiten":"Neue Anleitung",`
 <div class="form">
 <div class="field"><label>Art</label><select id="sfType"><option value="plan" ${s.type==="plan"?"selected":""}>Planmäßiger Umbau</option><option value="unplan" ${s.type==="unplan"?"selected":""}>Unplanmäßiger Umbau</option></select></div>
 <div class="field"><label>Titel der Anleitung</label><input id="sfName" value="${esc(s.name)}" placeholder="z. B. Werkzeugwechsel"></div>
 <div class="field"><label>Version</label><input value="${Number(s.version)||1}" disabled></div>
 <div class="field full"><label>Einleitung / Starttext</label><textarea id="sfIntro" placeholder="Was muss der Mitarbeiter vor Beginn wissen?">${esc(s.intro)}</textarea></div>
 <div class="field full"><label>Suchbegriffe</label><input id="sfTags" value="${esc(s.tags.join(", "))}" placeholder="z. B. Werkzeugwechsel, Umbau, Greifer"></div>
 </div>
 <h3>Schritte und Bilder</h3><p class="muted small">Jeder Schritt kann beliebig viele Bilder enthalten. Die Bilddaten werden im Backup mitgesichert.</p>
 <div id="steps">${stepEditors(s.steps)}</div>
 <div class="actions"><button class="btn secondary" onclick="addStep()">＋ Schritt</button><button class="btn primary" onclick="saveStandard()">Speichern</button></div>`);
}
function stepEditors(arr){return arr.map((s,i)=>`<div class="step"><div class="stepHead"><b>Schritt ${i+1}</b><div class="stepOrder"><button class="btn secondary mini" onclick="moveStep(${i},-1)" ${i===0?'disabled':''}>↑</button><button class="btn secondary mini" onclick="moveStep(${i},1)" ${i===arr.length-1?'disabled':''}>↓</button><button class="btn danger mini" onclick="removeStep(${i})">Löschen</button></div></div><div class="form" style="margin-top:10px"><div class="field full"><label>Überschrift</label><input class="stepTitle" data-i="${i}" value="${esc(s.title)}" placeholder="z. B. Werkzeug lösen"></div><div class="field full"><label>Anweisung / Text</label><textarea class="stepText" data-i="${i}" placeholder="Genaue Beschreibung des Arbeitsschrittes">${esc(s.text)}</textarea></div><div class="field full"><label>Wichtiger Hinweis</label><label class="check" style="margin-top:0"><input class="stepImportant" data-i="${i}" type="checkbox" ${s.important?'checked':''}> Diesen Schritt hervorheben</label><textarea class="stepImportantText" data-i="${i}" placeholder="z. B. Vor dem Öffnen der Vorschubwalzen beachten: ...">${esc(s.importantText||"")}</textarea></div><div class="field"><label>Ausführung</label><select class="stepRole" data-i="${i}"><option value="bediener" ${(s.role||'beide')==='bediener'?'selected':''}>🔵 Bediener</option><option value="einrichter" ${(s.role||'beide')==='einrichter'?'selected':''}>🔴 Einrichter</option><option value="beide" ${(s.role||'beide')==='beide'?'selected':''}>👥 Beide</option></select></div><div class="field"><label>Alternative Person</label><select class="stepAlternateRole" data-i="${i}"><option value="">Keine</option><option value="bediener" ${s.alternateRole==='bediener'?'selected':''}>🔵 Bediener (falls vorherige Arbeit fertig)</option><option value="einrichter" ${s.alternateRole==='einrichter'?'selected':''}>🔴 Einrichter (falls vorherige Arbeit fertig)</option></select></div><div class="field full"><label>Bilder</label><div class="drop"><input type="file" accept="image/*" multiple onchange="addImages(${i},this)"><div class="small muted">${s.images.length} Bild(er) gespeichert • Bilder können in der Anleitung vergrößert werden</div></div><div class="thumbs">${s.images.map((im,j)=>`<div class="thumb"><img src="${esc(im)}" onclick="viewImage(this.src)" style="cursor:zoom-in" title="Bild vergrößern"><div style="display:flex;gap:4px"><button class="btn secondary mini" onclick="replaceImage(${i},${j})" title="Bild ersetzen">↻</button><button class="btn danger mini" onclick="removeImage(${i},${j})">×</button></div></div>`).join("")}</div></div></div></div>`).join("")||'<div class="empty">Noch keine Schritte. Klicke auf „＋ Schritt“.</div>'}

function sync(){if(!editing)return;document.querySelectorAll(".stepTitle").forEach(x=>{let i=+x.dataset.i;if(editing.steps[i])editing.steps[i].title=x.value});document.querySelectorAll(".stepText").forEach(x=>{let i=+x.dataset.i;if(editing.steps[i])editing.steps[i].text=x.value});document.querySelectorAll(".stepImportant").forEach(x=>{let i=+x.dataset.i;if(editing.steps[i])editing.steps[i].important=x.checked});document.querySelectorAll(".stepImportantText").forEach(x=>{let i=+x.dataset.i;if(editing.steps[i])editing.steps[i].importantText=x.value});document.querySelectorAll(".stepRole").forEach(x=>{let i=+x.dataset.i;if(editing.steps[i])editing.steps[i].role=x.value});document.querySelectorAll(".stepAlternateRole").forEach(x=>{let i=+x.dataset.i;if(editing.steps[i])editing.steps[i].alternateRole=x.value||""})}
function moveStep(i,dir){sync();const j=i+dir;if(j<0||j>=editing.steps.length)return;[editing.steps[i],editing.steps[j]]=[editing.steps[j],editing.steps[i]];standardForm(editing.id)}
async function addImages(i,input){
 sync();
 for(const f of [...input.files]){
  const data=await dataURL(f);
  if(typeof data!=="string"||!data.startsWith("data:image/")) throw new Error("Bild konnte nicht gelesen werden");
  editing.steps[i].images.push(data);
 }
 standardForm(editing.id);
}
function addStep(){sync();editing.steps.push({title:"",text:"",images:[],important:false,importantText:"",role:"beide",alternateRole:""});standardForm(editing.id)}
function removeStep(i){sync();editing.steps.splice(i,1);standardForm(editing.id)}
function removeImage(i,j){sync();editing.steps[i].images.splice(j,1);standardForm(editing.id)}
function replaceImage(i,j){
 sync();
 const input=document.createElement("input");input.type="file";input.accept="image/*";
 input.onchange=async()=>{const f=input.files?.[0];if(!f)return;try{const data=await dataURL(f);if(typeof data!=="string"||!data.startsWith("data:image/"))throw new Error("Bild konnte nicht gelesen werden");editing.steps[i].images[j]=data;standardForm(editing.id)}catch(e){alert(e.message)}};
 input.click();
}
async function saveStandard(){
 sync();editing.type=document.getElementById("sfType").value;editing.name=document.getElementById("sfName").value.trim();editing.intro=document.getElementById("sfIntro").value;editing.tags=document.getElementById("sfTags").value.split(",").map(x=>x.trim()).filter(Boolean);
 if(!editing.name){alert("Bitte einen Titel eingeben.");return}
 const i=state.standards.findIndex(x=>x.id===editing.id);
 if(i>=0){editing.version=(Number(state.standards[i].version)||1)+1;editing.updatedAt=new Date().toISOString();state.standards[i]=editing}
 else {editing.version=1;editing.createdAt=editing.createdAt||new Date().toISOString();editing.updatedAt=new Date().toISOString();state.standards.push(editing)}
 await save();closeModal();standardList(editing.type)
}

async function requestWakeLock(){try{if("wakeLock" in navigator){wakeLock=await navigator.wakeLock.request("screen");wakeLock.addEventListener?.("release",()=>{wakeLock=null})}}catch(e){wakeLock=null}}
async function releaseWakeLock(){try{await wakeLock?.release()}catch{}wakeLock=null}
// Die Anleitung startet bewusst direkt mit Schritt 1. Die Einleitung wird nur auf der Auswahlseite angezeigt.
function startGuide(id){
 const s=state.standards.find(x=>x.id===id);if(!s)return;
 if(!s.steps.length){alert("Diese Anleitung enthält noch keine Schritte.");return}
 requestWakeLock();s.recentAt=Date.now();state.recent=(state.recent||[]).filter(x=>x!==id);state.recent.unshift(id);state.recent=state.recent.slice(0,6);save();
 let i=0;
 const draw=()=>{document.getElementById("wiz")?.remove();const st=s.steps[i];
 document.body.insertAdjacentHTML("beforeend",`<div class="modal" id="wiz"><div class="box wizard"><div class="modalHead"><div><div class="small muted">${s.type==="plan"?"PLANMÄSSIGER":"UNPLANMÄSSIGER"} UMBAU</div><h2 style="margin:4px 0">${esc(s.name)}</h2></div><button class="close" onclick="abortGuide()">✕</button></div><div style="margin-top:14px"><div class="progress"><i style="width:${(i+1)/Math.max(s.steps.length,1)*100}%"></i></div><p class="small muted">Schritt ${i+1} von ${s.steps.length}</p><div class="card" style="box-shadow:none"><div class="stepRoleBadge role-${st.role||'beide'}">${st.role==="bediener"?"🔵 BEDIENER":st.role==="einrichter"?"🔴 EINRICHTER":"👥 BEIDE"}${st.alternateRole?` <span class="muted">· zusätzlich ${st.alternateRole==="bediener"?"Bediener":"Einrichter"} (falls vorherige Arbeit fertig)</span>`:""}</div><h2>${esc(st.title)}</h2>${st.important?`<div class="notice"><b>⚠️ WICHTIG</b><div style="white-space:pre-wrap;margin-top:7px">${esc(st.importantText||"Bitte diesen Arbeitsschritt besonders beachten.")}</div></div>`:""}<p style="white-space:pre-wrap;line-height:1.7">${esc(st.text)}</p>${st.images.map(x=>`<img class="wimg" src="${esc(x)}" onclick="viewImage(this.src)" style="cursor:zoom-in" title="Bild vergrößern">`).join("")}</div>${st.important?`<label class="check"><input id="wd" type="checkbox"> Schritt geprüft und erledigt</label>`:""}<div class="actions"><button class="btn secondary" onclick="prevGuide()">${i?"← Zurück":"Abbrechen"}</button><button class="btn primary" onclick="nextGuide()">${i<s.steps.length-1?"Nächster Schritt →":"✓ Umbau abschließen"}</button></div></div></div></div>`)};
 function abortGuide(){document.getElementById("wiz")?.remove();releaseWakeLock()}
 window.prevGuide=()=>{if(i>0){i--;draw()}else{abortGuide()}};
 window.abortGuide=abortGuide;
 window.nextGuide=()=>{const currentStep=s.steps[i];if(currentStep?.important&&!document.getElementById("wd")?.checked){alert("Bitte den wichtigen Schritt bestätigen.");return}if(i<s.steps.length-1){i++;draw()}else{drawFinished()}};
 function drawFinished(){document.getElementById("wiz")?.remove();document.body.insertAdjacentHTML("beforeend",`<div class="modal" id="wiz"><div class="box wizard"><div class="modalHead"><div><div class="small muted">${s.type==="plan"?"PLANMÄSSIGER":"UNPLANMÄSSIGER"} UMBAU</div><h2 style="margin:4px 0">${esc(s.name)}</h2></div><button class="close" onclick="document.getElementById('wiz').remove();releaseWakeLock();home()">✕</button></div><div class="card" style="box-shadow:none;text-align:center;margin-top:18px"><div style="font-size:52px">✅</div><h2>Umbau abgeschlossen</h2><p class="muted">Alle ${s.steps.length} Schritte wurden geprüft.</p></div><div class="actions"><button class="btn secondary" onclick="document.getElementById('wiz')?.remove();releaseWakeLock();home()">🏠 Zur Startseite</button><button class="btn primary" onclick="document.getElementById('wiz')?.remove();releaseWakeLock();startGuide('${s.id}')">↻ Erneut starten</button></div></div></div>`)}
 draw()
}
function viewImage(src){document.getElementById("imageViewer")?.remove();document.body.insertAdjacentHTML("beforeend",`<div class="modal" id="imageViewer" onclick="this.remove()"><div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:10px"><img src="${esc(src)}" style="max-width:100%;max-height:100%;object-fit:contain;border-radius:12px;box-shadow:0 10px 40px #0008"></div></div>`)}
function search(){shell("search",`<section class="hero"><div class="eyebrow">SCHNELLSUCHE</div><h1>Rüstwissen suchen</h1><p>Suche in Rüststandards und Arbeitsschritten.</p></section><input id="q" class="search" list="standardNumbers" placeholder="🔎 z. B. 41005, 408-03, Greifer, VDP..." oninput="doSearch()"><datalist id="standardNumbers">${state.standards.map(s=>`<option value="${esc(s.name)}">`).join("")}</datalist><div id="results"></div>`)}
function doSearch(){const q=document.getElementById("q").value.toLowerCase().trim();if(!q){results.innerHTML='<div class="empty">Suchbegriff eingeben.</div>';return}let a=[];state.standards.forEach(s=>{if(JSON.stringify(s).toLowerCase().includes(q))a.push(`<div class="item"><div><div class="itemTitle">📋 ${esc(s.name)}</div><div class="muted">${s.type==="plan"?"Planmäßiger":"Unplanmäßiger"} Umbau • ${s.steps.length} Schritte</div></div><div class="actions" style="margin:0"><button class="star ${s.favorite?"on":""}" onclick="toggleFavorite('${s.id}')">${s.favorite?"★":"☆"}</button><button class="btn primary" onclick="startGuide('${s.id}')">Öffnen →</button></div></div>`)});results.innerHTML=a.length?`<div class="list">${a.join("")}</div>`:'<div class="empty">Nichts gefunden.</div>'}

function modal(title,body){document.body.insertAdjacentHTML("beforeend",`<div class="modal" id="modal"><div class="box"><div class="modalHead"><h2 style="margin:0">${title}</h2><button class="close" onclick="closeModal()">✕</button></div><div style="margin-top:15px">${body}</div></div></div>`)}
function closeModal(){document.getElementById("modal")?.remove()}
function dataURL(f){return new Promise((ok,no)=>{let r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)})}

async function makeBackupPayload(){
 const data=clone({version:1,standards:state.standards,recent:state.recent||[],lastBackup:state.lastBackup||null});
 const canonical=JSON.stringify(data);
 const hash=await sha256(canonical);
 return {format:"RuestStandardBackup",version:3,created:new Date().toISOString(),checksum:{algorithm:"SHA-256",value:hash},data};
}
async function sha256(text){
 const bytes=new TextEncoder().encode(text);
 const digest=await crypto.subtle.digest("SHA-256",bytes);
 return [...new Uint8Array(digest)].map(b=>b.toString(16).padStart(2,"0")).join("");
}
function validateBackupPayload(payload){
 const d=payload?.data||payload;
 if(!d||!Array.isArray(d.standards)||!Array.isArray(d.recent))throw new Error("Ungültige Datenstruktur");
 let imgs=0,steps=0;
 for(const st of d.standards){
  if(!st.id||!Array.isArray(st.steps))throw new Error("Ein Standard ist unvollständig");
  for(const step of st.steps){
   steps++;
   if(!Array.isArray(step.images))throw new Error("Ein Schritt ist unvollständig");
   for(const img of step.images){
    imgs++;
    if(typeof img!=="string"||!img.startsWith("data:image/"))throw new Error("Bilddaten fehlen oder sind beschädigt");
   }
  }
 }
 return {data:d,images:imgs,steps};
}
async function verifyBackupPayload(payload){
 const v=validateBackupPayload(payload);
 if(payload.checksum?.value){
  const actual=await sha256(JSON.stringify(v.data));
  if(actual!==payload.checksum.value)throw new Error("Die Backup-Datei wurde verändert oder ist beschädigt (Prüfsumme stimmt nicht)");
 }
 const roundtrip=JSON.parse(JSON.stringify(v.data));
 if(JSON.stringify(roundtrip)!==JSON.stringify(v.data))throw new Error("Daten-Roundtrip fehlgeschlagen");
 if(v.images!==countBackupImages(v.data))throw new Error("Bildanzahl stimmt nicht überein");
 for(const st of v.data.standards)for(const step of st.steps)for(const img of step.images){
  if(typeof img!=="string"||!img.startsWith("data:image/"))throw new Error("Bilddaten fehlen");
 }
 return v;
}
function countBackupImages(d){return (d.standards||[]).reduce((n,s)=>n+(s.steps||[]).reduce((m,st)=>m+(st.images||[]).length,0),0)}
async function backupCheck(silent=false){
 try{
  const payload=await makeBackupPayload();
  const v=await verifyBackupPayload(payload);
  if(!silent)alert(`Backup-Test erfolgreich.\n\n✓ ${v.data.standards.length} Standards\n✓ ${v.steps} Schritte\n✓ ${v.images} Bild(er)\n✓ Texte und Reihenfolge\n✓ Favoriten und zuletzt verwendet\n✓ Prüfsumme SHA-256\n✓ Vollständiger Daten-Roundtrip`);
  return true;
 }catch(e){if(!silent)alert("Backup-Test fehlgeschlagen: "+e.message);return false}
}
async function backup(){
 try{
  if(!(await backupCheck(true))){alert("Backup wurde nicht erstellt, weil die Prüfung fehlgeschlagen ist.");return}
  state.lastBackup=new Date().toISOString();
  await save();
  // Vor dem Export noch einmal direkt aus IndexedDB lesen. So wird wirklich
  // der gespeicherte Datenbestand gesichert und nicht nur der RAM-Zustand.
  const persisted=await get("state");
  if(!persisted)throw new Error("Die Daten konnten vor dem Backup nicht aus dem Speicher gelesen werden");
  if(JSON.stringify(persisted)!==JSON.stringify(state))throw new Error("Gespeicherte Daten und aktueller Datenbestand stimmen nicht überein");
  const payload=await makeBackupPayload();
  await verifyBackupPayload(payload);
  const text=JSON.stringify(payload,null,2);
  const blob=new Blob([text],{type:"application/json;charset=utf-8"});
  const filename="RuestStandard-Vollbackup.json";
  const url=URL.createObjectURL(blob);
  // iPhone/iPad: zuerst die native Teilen/Speichern-Funktion anbieten, falls verfügbar.
  if(navigator.share && typeof File!=="undefined"){
   try{
    const file=new File([blob],filename,{type:"application/json"});
    if(!navigator.canShare || navigator.canShare({files:[file]})){
     await navigator.share({title:"RüstStandard Vollbackup",files:[file]});
     URL.revokeObjectURL(url);admin();return;
    }
   }catch(e){ if(e?.name==="AbortError"){URL.revokeObjectURL(url);admin();return;} }
  }
  const a=document.createElement("a");a.href=url;a.download=filename;a.target="_blank";a.rel="noopener";a.textContent="Backup-Datei öffnen / speichern";
  a.style.display="none";document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),10000);
  alert("Backup wurde erstellt und geprüft.\n\nDie Datei 'RuestStandard-Vollbackup.json' wurde zum Speichern geöffnet.\nBitte die Datei in der Dateien-App/Downloads aufbewahren.");
  admin();
 }catch(e){alert("Backup konnte nicht erstellt werden: "+e.message)}
}
function normalizeBackupData(d){
 return {
  version:1,
  standards:(d.standards||[]).map(x=>({...x,
   version:Number(x.version)||1,
   createdAt:x.createdAt||null,
   updatedAt:x.updatedAt||null,
   favorite:!!x.favorite,
   steps:(x.steps||[]).map(st=>({...st,
    images:Array.isArray(st.images)?st.images:[],
    important:!!st.important,
    importantText:st.importantText||"",
    role:st.role||"beide",
    alternateRole:st.alternateRole||""
   }))
  })),
  recent:(d.recent||[]),
  lastBackup:d.lastBackup||null
 };
}
async function readTextFile(file){
 try{
  if(typeof file.text==="function") return await file.text();
 }catch(e){}
 return await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result||""));r.onerror=()=>no(r.error||new Error("Datei konnte nicht gelesen werden"));r.readAsText(file);});
}
async function saveReliable(value){
 let lastErr=null;
 for(let attempt=1;attempt<=3;attempt++){
  try{
   await set("state",clone(value));
   const check=await get("state");
   if(check && JSON.stringify(check)===JSON.stringify(value)) return check;
   lastErr=new Error("Die gespeicherten Daten konnten nicht eindeutig verifiziert werden");
  }catch(e){lastErr=e;}
  await new Promise(r=>setTimeout(r,150*attempt));
 }
 throw lastErr||new Error("Speichern fehlgeschlagen");
}
async function restore(){
 const input=document.createElement("input");
 input.type="file";
 input.accept=".json,application/json,text/json";
 // iPad/iPhone Safari ist bei input.click() auf einem nicht eingefügten
 // Element gelegentlich unzuverlässig. Deshalb wird das Element kurz in
 // den DOM eingefügt und erst danach der Dateidialog geöffnet.
 input.style.position="fixed";
 input.style.left="-10000px";
 input.style.top="0";
 input.style.opacity="0";
 input.setAttribute("aria-hidden","true");
 document.body.appendChild(input);
 const cleanup=()=>{try{input.value="";input.remove()}catch(e){}};
 input.onchange=async()=>{
  const file=input.files?.[0];
  if(!file){cleanup();return}
  const oldState=clone(state);
  try{
   if(file.size===0) throw new Error("Die Backup-Datei ist leer");
   const text=await readTextFile(file);
   if(!text.trim()) throw new Error("Die Backup-Datei enthält keinen Inhalt");
   let p;
   try{p=JSON.parse(text.replace(/^\uFEFF/,""));}
   catch(e){throw new Error("Die Backup-Datei ist keine gültige JSON-Datei")}

   // Vollständig prüfen, bevor auch nur ein Byte des aktuellen Zustands ersetzt wird.
   const v=await verifyBackupPayload(p);
   const normalized=normalizeBackupData(v.data);
   const normalizedSource=normalizeBackupData(v.data);
   if(JSON.stringify(normalized)!==JSON.stringify(normalizedSource))throw new Error("Backup-Normalisierung fehlgeschlagen");

   // Atomar wirkender Import: erst erfolgreich in IndexedDB schreiben,
   // danach RAM-Zustand und Anzeige übernehmen.
   const stored=await saveReliable(normalized);
   const storedNormalized=normalizeBackupData(stored);
   if(JSON.stringify(storedNormalized)!==JSON.stringify(normalized))throw new Error("Die gespeicherten Daten stimmen nicht mit dem Backup überein");
   if(countBackupImages(storedNormalized)!==v.images)throw new Error("Nicht alle Bilder wurden wiederhergestellt");
   const restoredHash=await sha256(JSON.stringify(storedNormalized));
   const sourceHash=await sha256(JSON.stringify(normalizedSource));
   if(restoredHash!==sourceHash)throw new Error("Die wiederhergestellten Daten unterscheiden sich vom Backup");

   state=storedNormalized;
   alert(`Backup vollständig wiederhergestellt und geprüft.\n\n✓ ${storedNormalized.standards.length} Standards\n✓ ${storedNormalized.standards.reduce((n,s)=>n+s.steps.length,0)} Schritte\n✓ ${countBackupImages(storedNormalized)} Bild(er)\n✓ Texte und Reihenfolge\n✓ Favoriten und zuletzt verwendet\n✓ Daten nach Wiederherstellung erneut verglichen\n✓ Prüfsumme / Dateiintegrität geprüft`);
   cleanup();
   admin();
  }catch(e){
   // Falls der Import nach dem Schreiben doch noch scheitert, den vorherigen
   // Zustand wiederherstellen. Wenn das nicht möglich ist, bleibt der bereits
   // gespeicherte Zustand unverändert, weil die Validierung vorher erfolgt.
   try{await saveReliable(oldState);state=oldState}catch(_e){state=oldState}
   cleanup();
   alert("Backup konnte nicht wiederhergestellt werden: "+(e?.message||e));
  }
 };
 input.onerror=()=>{cleanup();alert("Die Backup-Datei konnte nicht ausgewählt werden.")};
 input.click();
}
async function deleteStandard(id){if(!confirm("Anleitung wirklich löschen?"))return;state.standards=state.standards.filter(x=>x.id!==id);state.recent=(state.recent||[]).filter(x=>state.standards.some(s=>s.id===x));await save();closeModal();admin()}
(async()=>{
 const stored=await get("state");
 if(stored&&stored.version===1)state={...state,...stored,recent:Array.isArray(stored.recent)?stored.recent:[],lastBackup:stored.lastBackup||null};
 state.standards=state.standards.map(x=>({...x,version:Number(x.version)||1,createdAt:x.createdAt||null,updatedAt:x.updatedAt||null,favorite:!!x.favorite,steps:(x.steps||[]).map(st=>({...st,images:Array.isArray(st.images)?st.images:[],important:!!st.important,importantText:st.importantText||""}))}));
 const template=readDefaultTemplate();
 const existingIds=new Set(state.standards.map(x=>x.id));
 const missing=template.standards.filter(x=>!existingIds.has(x.id));
 if(missing.length){
  const templateIds=new Set(template.standards.map(x=>x.id));
  const existingBuiltIns=state.standards.filter(x=>templateIds.has(x.id));
  const custom=state.standards.filter(x=>!templateIds.has(x.id));
  const byId=new Map(existingBuiltIns.map(x=>[x.id,x]));
  state.standards=[...template.standards.map(x=>byId.get(x.id)||clone(x)),...custom];
  await save();
 }
 state.recent=(state.recent||[]).filter(id=>state.standards.some(x=>x.id===id));
 home();
})();
</script>
